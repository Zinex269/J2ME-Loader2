name: Build J2ME Console APK

# Use inside YOUR FORK of nikita36078/J2ME-Loader, saved as .github/workflows/build.yml
env:
  APP_NAME: "J2ME Console"

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rename the app (display name only)
        run: |
          sed -i "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">$APP_NAME</string>#" app/src/main/res/values/strings.xml
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml

      - name: Build the APK
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show the error on the run summary page
        if: failure()
        run: |
          {
            echo '### Build error'
            echo '```'
            if [ -f build.log ]; then grep -A12 -m1 'What went wrong' build.log || tail -n 40 build.log; else echo 'Failed before Gradle started. Open the previous step for details.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: j2me-console-apk
          path: app/build/outputs/apk/**/*.apk
